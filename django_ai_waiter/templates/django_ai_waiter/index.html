<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Waiter 🍽️</title>
    <style>
             * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 32px;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            color: #ff6b35;
        }

        .header-title p {
            font-size: 12px;
            color: #888;
        }

        .status-badge {
            background: #1a3a1a;
            border: 1px solid #2d5a2d;
            color: #4caf50;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
         /* Table info bar */
        .table-bar {
            background: #1a1a1a;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #222;
            font-size: 13px;
            color: #888;
        }

        .table-bar span {
            color: #ff6b35;
            font-weight: 600;
        }

        /* Main layout */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Chat section */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        /* Message bubbles */
        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .avatar.user-avatar {
            background: #ff6b35;
        }

        .avatar.ai-avatar {
            background: #1a3a1a;
            border: 1px solid #2d5a2d;
        }

        .bubble {
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 18px;
            line-height: 1.8;
            max-width: 100%;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: #ff6b35;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .bubble {
            background: #1e1e1e;
            border: 1px solid #333;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .timestamp {
            font-size: 10px;
            color: #555;
            margin-top: 4px;
            text-align: right;
        }

         </style>
</head>
<body>
