[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-waiter-order"
version = "1.0.0"
description = "Enterprise AI-powered restaurant ordering system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["django", "ai", "restaurant", "chatbot", "groq"]

dependencies = [
    "django>=6.0",
    "djangorestframework",
    "psycopg2-binary",
    "python-dotenv",
    "groq",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "factory-boy",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.settings"
python_files = ["tests/*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["."]
include = ["django_ai_waiter*"]